<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор накладных</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
            --border: #E5E7EB;
            --danger: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 24px;
            text-align: center;
            color: var(--text);
        }

        .header-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 40px;
            gap: 12px;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-light);
            padding: 0 8px;
        }

        .items-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .item-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 40px;
            gap: 12px;
            align-items: center;
            background: #F9FAFB;
            padding: 12px 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .item-row:focus-within {
            border-color: var(--primary);
            background: #fff;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px; /* 16px предотвращает автозум на iOS */
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }

        input:focus {
            border-color: var(--primary);
        }

        .row-total {
            font-weight: 600;
            text-align: right;
            padding-right: 8px;
            font-size: 16px;
        }

        .btn-remove {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            height: 40px;
            transition: color 0.2s, background 0.2s;
        }

        .btn-remove:hover {
            color: var(--danger);
            background: #FEE2E2;
        }

        .btn-add {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 24px;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }

        .grand-total-container {
            border-top: 2px dashed var(--border);
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
        }

        .grand-total-value {
            color: var(--primary);
            font-size: 28px;
        }

        /* Адаптация под очень узкие экраны (мобилки) */
        @media (max-width: 480px) {
            .header-row {
                display: none; /* Прячем заголовки колонок на мобилках */
            }
            .item-row {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                position: relative;
                padding: 16px;
            }
            .btn-remove {
                position: absolute;
                top: 4px;
                right: 4px;
                height: 32px;
                width: 32px;
                font-size: 20px;
            }
            .row-total {
                grid-column: span 2;
                text-align: left;
                margin-top: 8px;
                padding-top: 8px;
                border-top: 1px solid var(--border);
                color: var(--primary);
            }
            .row-total::before {
                content: "Сума: ";
                color: var(--text-light);
                font-weight: normal;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Сборка заказа 📦</h1>

        <div class="header-row">
            <div>Вес (кг)</div>
            <div>Цена за кг</div>
            <div style="text-align: right; padding-right: 8px;">Сумма</div>
            <div></div>
        </div>

        <div id="items-container" class="items-container">
            <!-- Сюда будут добавляться строки -->
        </div>

        <button class="btn-add" onclick="addRow()">+ Добавить позицию</button>

        <div class="grand-total-container">
            <div>Итого к оплате:</div>
            <div class="grand-total-value"><span id="grand-total">0.00</span> ₴</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('items-container');
        const grandTotalElement = document.getElementById('grand-total');

        // Шаблон новой строки
        function createRowElement() {
            const row = document.createElement('div');
            row.className = 'item-row';
            
            row.innerHTML = `
                <input type="number" step="0.01" min="0" class="input-weight" placeholder="Кг" oninput="calculate()">
                <input type="number" step="0.01" min="0" class="input-price" placeholder="Цена, ₴" oninput="calculate()">
                <div class="row-total">0.00</div>
                <button class="btn-remove" onclick="removeRow(this)" title="Удалить">×</button>
            `;
            return row;
        }

        // Добавление новой строки
        function addRow() {
            container.appendChild(createRowElement());
            // Фокус на первый инпут новой строки
            const inputs = container.lastElementChild.querySelectorAll('input');
            if (inputs.length > 0) inputs[0].focus();
        }

        // Удаление строки
        function removeRow(button) {
            const row = button.parentElement;
            // Оставляем хотя бы одну строку
            if (container.children.length > 1) {
                row.remove();
                calculate();
            } else {
                // Если строка одна, просто очищаем её
                row.querySelector('.input-weight').value = '';
                row.querySelector('.input-price').value = '';
                calculate();
            }
        }

        // Главная функция подсчета
        function calculate() {
            let grandTotal = 0;
            const rows = document.querySelectorAll('.item-row');

            rows.forEach(row => {
                const weightInput = row.querySelector('.input-weight').value;
                const priceInput = row.querySelector('.input-price').value;
                const rowTotalDisplay = row.querySelector('.row-total');

                const weight = parseFloat(weightInput) || 0;
                const price = parseFloat(priceInput) || 0;
                
                const rowTotal = weight * price;
                grandTotal += rowTotal;

                // Обновляем сумму в конкретной строке
                rowTotalDisplay.textContent = rowTotal > 0 ? rowTotal.toFixed(2) : '0.00';
            });

            // Обновляем общую сумму
            grandTotalElement.textContent = grandTotal.toFixed(2);
        }

        // Добавляем первую пустую строку при загрузке страницы
        window.onload = () => {
            addRow();
        };
    </script>

</body>
</html>
